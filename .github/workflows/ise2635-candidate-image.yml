name: ISE-2635 candidate backend image

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Reviewed backend source commit to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-candidate:
    if: github.repository == 'multica-ai/multica' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      IMAGE_NAME: ghcr.io/multica-ai/multica-backend
      DOCKERFILE_REVISION: 1a006ed3acd259124b97165377ae32477155eb03
    steps:
      - name: Validate reviewed source SHA
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha must be a full 40-character lowercase commit SHA"
            exit 1
          fi
          if [[ "$SOURCE_SHA" != "fb9da0941a934fd5e587769d5e4c50056a171443" ]]; then
            echo "::error::source_sha is not the reviewed ISE-2635 commit"
            exit 1
          fi

      - name: Checkout reviewed source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}

      - name: Verify Dockerfile revision and source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          actual_dockerfile_revision="$(git rev-parse "${SOURCE_SHA}:Dockerfile")"
          if [[ "$actual_dockerfile_revision" != "$DOCKERFILE_REVISION" ]]; then
            echo "::error::Dockerfile blob does not match the reviewed build record"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish unique candidate image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:ise2635-candidate-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: org.opencontainers.image.revision=${{ inputs.source_sha }}
          build-args: |
            VERSION=ise2635-candidate
            COMMIT=${{ inputs.source_sha }}

      - name: Write reviewed build record
        id: record
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          BUILD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IMAGE_TAG: ${{ env.IMAGE_NAME }}:ise2635-candidate-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          record = {
              "commit": os.environ["SOURCE_SHA"],
              "digest": f"{os.environ['IMAGE_NAME']}@{os.environ['IMAGE_DIGEST']}",
              "build_run_url": os.environ["BUILD_RUN_URL"],
              "dockerfile_revision": os.environ["DOCKERFILE_REVISION"],
              "oci_revision": os.environ["SOURCE_SHA"],
              "image_tag": os.environ["IMAGE_TAG"],
          }
          Path("build-record.json").write_text(json.dumps(record, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"digest={record['digest']}\n")
              output.write(f"record={json.dumps(record, sort_keys=True)}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Reviewed candidate image build\n\n")
              summary.write("```json\n" + json.dumps(record, indent=2) + "\n```\n")
          PY

      - name: Upload reviewed build record
        uses: actions/upload-artifact@v4
        with:
          name: ise2635-build-record-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-record.json
          if-no-files-found: error
          retention-days: 90
